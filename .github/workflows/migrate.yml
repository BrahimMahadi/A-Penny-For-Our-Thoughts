name: Supabase Migrations

# Runs on every merge to main and on manual trigger.
# Two jobs in sequence:
#   1. migrate  — apply any pending migration files to the live DB
#   2. sync-types — regenerate src/types/database.ts from the live schema
#                   and commit it back if it drifted (catches the BUG-023 pattern)
#
# Required GitHub secrets (Settings → Secrets → Actions):
#   SUPABASE_ACCESS_TOKEN  — personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_ID    — reference ID from Supabase Dashboard → Project Settings → General

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'   # only run when a migration file actually changed
      - '.github/workflows/migrate.yml'
  workflow_dispatch:               # allow manual trigger from the Actions tab

permissions:
  contents: write                  # needed to commit regenerated types back to main

concurrency:
  group: supabase-migrate
  cancel-in-progress: false        # never cancel a running migration

jobs:
  # ─── Job 1: apply pending migrations ──────────────────────────────
  migrate:
    name: Apply DB migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Baseline pre-CLI migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Migrations 001–003 were applied manually to Supabase before this
          # workflow existed, so the CLI's migration history table is empty.
          # Mark them as already applied so `db push` skips them and only
          # runs genuinely new migrations (004 onward).
          supabase migration repair --status applied 001 || true
          supabase migration repair --status applied 002 || true
          supabase migration repair --status applied 003 || true

      - name: Push pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push

  # ─── Job 2: regenerate TypeScript types from live schema ──────────
  sync-types:
    name: Sync database.ts types
    runs-on: ubuntu-latest
    needs: migrate              # always run after migrations so types reflect the new schema

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Regenerate src/types/database.ts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase gen types typescript \
            --project-id ${{ secrets.SUPABASE_PROJECT_ID }} \
            > src/types/database.ts

      # ─── BUG-022 fix ────────────────────────────────────────────────
      # `supabase gen types typescript` does NOT produce the convenience
      # `*Row` re-export aliases that src/lib/db.ts and several test files
      # import by name (ProfileRow, WishlistItemRow, etc.). Before this
      # step was added, the regenerate step would silently truncate them,
      # turning every db.ts import into a TS2305 error and failing the
      # next deploy. We append the hand-maintained block here so the
      # commit-back step always produces a working tree.
      #
      # If a new table is added to the database, also add its Row alias
      # to the list below (same naming convention: TableName + 'Row').
      - name: Re-append *Row aliases
        run: |
          cat >> src/types/database.ts <<'EOF'

          // ─────────────────────────────────────────────────────────────────
          //  HAND-MAINTAINED RE-EXPORTS — KEEP BELOW THIS LINE
          //
          //  `supabase gen types typescript` does NOT produce these aliases.
          //  This block is appended by .github/workflows/migrate.yml's
          //  "Re-append *Row aliases" step after every regenerate so that
          //  src/lib/db.ts's imports continue to resolve. (See BUG-022.)
          //  If you add a new table to the schema, add its Row alias here
          //  too — otherwise CI will fail on the next migration.
          // ─────────────────────────────────────────────────────────────────

          type _DbTables = Database['public']['Tables']

          export type ProfileRow               = _DbTables['profiles']['Row']
          export type IncomeStreamRow          = _DbTables['income_streams']['Row']
          export type ExpenseCardRow           = _DbTables['expense_cards']['Row']
          export type ExpenseItemRow           = _DbTables['expense_items']['Row']
          export type PurchaseRow              = _DbTables['purchases']['Row']
          export type SpendingHistoryPeriodRow = _DbTables['spending_history_periods']['Row']
          export type SpendingHistoryItemRow   = _DbTables['spending_history_items']['Row']
          export type LoanRow                  = _DbTables['loans']['Row']
          export type CreditCardRow            = _DbTables['credit_cards']['Row']
          export type SubscriptionRow          = _DbTables['subscriptions']['Row']
          export type WishlistItemRow          = _DbTables['wishlist_items']['Row']
          export type SavingsAccountRow        = _DbTables['savings_accounts']['Row']
          export type GoalRow                  = _DbTables['goals']['Row']
          export type AssetRow                 = _DbTables['assets']['Row']
          export type NetWorthSnapshotRow      = _DbTables['net_worth_snapshots']['Row']
          export type RuleRow                  = _DbTables['rules']['Row']
          export type BudgetAlertRow           = _DbTables['budget_alerts']['Row']
          export type SpendingCategoryRow      = _DbTables['spending_categories']['Row']
          EOF

      - name: Commit updated types (if schema drifted)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/types/database.ts
          if git diff --cached --quiet; then
            echo "✓ database.ts is already in sync — no commit needed"
          else
            echo "⚠ database.ts drifted from live schema — committing fix"
            git commit -m "chore: sync database.ts with live Supabase schema [skip ci]"
            git push
          fi
