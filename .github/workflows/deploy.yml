name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Sets permissions so the workflow can push to gh-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time; cancel any in-progress run
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node version comes from .nvmrc so the deploy toolchain matches CI and
      # local development. Node 20 was previously hard-coded here and reached
      # end-of-life on 2026-04-30 — an unpatched runtime building the shipped
      # bundle. Do NOT hard-code a version; change .nvmrc and all three follow.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Bake Supabase credentials into the client bundle at build time.
          # Set these in GitHub → Settings → Secrets → Actions:
          #   VITE_SUPABASE_URL  — your project URL (https://xxx.supabase.co)
          #   VITE_SUPABASE_ANON_KEY — your project anon/public key
          # The anon key is safe to expose; Row Level Security policies
          # (migration 002) ensure each user only sees their own rows.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Upload the dist/ folder as a Pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Deploy the artifact to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
