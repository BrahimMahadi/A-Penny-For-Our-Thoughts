<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Suite — A Penny For Our Thoughts</title>
  <style>
    :root {
      --bg:       #0f1623;
      --surface:  #1a2332;
      --surface2: #232d3f;
      --border:   #3a4456;
      --text:     #e8eaf0;
      --muted:    #8b95ad;
      --pass:     #00d4aa;
      --fail:     #ff4d6d;
      --warn:     #ffa63d;
      --accent:   #6c63ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px; line-height: 1.5;
    }
    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 20px 32px; display: flex; align-items: center; gap: 16px;
    }
    header h1 { font-size: 18px; font-weight: 700; }
    header .subtitle { color: var(--muted); font-size: 13px; }
    .summary {
      display: flex; gap: 12px; padding: 20px 32px;
      border-bottom: 1px solid var(--border); background: var(--surface);
    }
    .stat {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 20px; text-align: center; min-width: 100px;
    }
    .stat .val { font-size: 24px; font-weight: 700; }
    .stat .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .stat.pass .val { color: var(--pass); }
    .stat.fail .val { color: var(--fail); }
    .stat.total .val { color: var(--accent); }
    main { padding: 24px 32px; }
    .suite { margin-bottom: 24px; }
    .suite-header {
      font-size: 13px; font-weight: 700; color: var(--accent);
      padding: 8px 0; border-bottom: 1px solid var(--border); margin-bottom: 8px;
      letter-spacing: 0.05em; text-transform: uppercase;
    }
    .test-row {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 6px 8px; border-radius: 4px; margin-bottom: 2px;
    }
    .test-row:hover { background: var(--surface2); }
    .badge {
      font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 3px;
      min-width: 38px; text-align: center; flex-shrink: 0; margin-top: 2px;
    }
    .badge.pass { background: rgba(0,212,170,0.15); color: var(--pass); }
    .badge.fail { background: rgba(255,77,109,0.15); color: var(--fail); }
    .test-name { flex: 1; }
    .test-msg { font-size: 12px; color: var(--fail); margin-top: 2px; font-family: 'SF Mono', 'Consolas', monospace; }
    footer {
      border-top: 1px solid var(--border); padding: 16px 32px;
      color: var(--muted); font-size: 12px;
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>🧪 A Penny For Our Thoughts — Test Suite</h1>
    <div class="subtitle" id="run-info">Loading…</div>
  </div>
</header>

<div class="summary" id="summary"></div>

<main id="results-container"></main>

<footer>
  Tests run automatically on page load. Refresh to re-run.
  Source: <code>tests/unit-tests.js</code>
</footer>

<!--
  Load source modules in dependency order (mirrors index.html script order).
  `state` starts as an empty object; tests set it up per-suite.
-->
<script src="../src/utils.js"></script>

<!-- Minimal stubs for DOM-dependent globals used by state.js/analytics.js -->
<script>
  // Stub localStorage for the test environment (all ops are no-ops / in-memory)
  const _store = {};
  if (typeof localStorage === 'undefined') {
    window.localStorage = {
      getItem:    k => _store[k] ?? null,
      setItem:    (k, v) => { _store[k] = v; },
      removeItem: k => { delete _store[k]; },
    };
  }

  // Stub DOM methods referenced by state.js theme helpers so they don't throw
  if (!document.documentElement.setAttribute.__isStub) {
    const _origSet = document.documentElement.setAttribute.bind(document.documentElement);
    document.documentElement.setAttribute = (k, v) => {
      if (k === 'data-theme') return; // suppress theme application in tests
      _origSet(k, v);
    };
    document.documentElement.setAttribute.__isStub = true;
  }

  // document.getElementById stub for non-existent elements (theme toggle btn)
  const _origGetEl = document.getElementById.bind(document);
  document.getElementById = id => {
    // For test infrastructure targets allow real lookup; suppress missing-element throws
    const el = _origGetEl(id);
    return el;
  };
</script>

<script src="../src/state.js"></script>

<!-- Stub analyticsFilters (normally declared in app.js) before analytics.js loads -->
<script>
  let analyticsFilters = { startDate: '', endDate: '', search: '' };
</script>

<script src="../src/analytics.js"></script>

<!-- Run tests (unit-tests.js must be loaded AFTER all sources) -->
<script src="./unit-tests.js"></script>

<script>
(function runAndRender() {
  // Reset state to clean baseline before each suite has a chance to corrupt globals
  const report = getTestReport();

  // ── Summary bar ───────────────────────────────────────────────
  const duration = performance.now().toFixed(0);
  document.getElementById('run-info').textContent =
    `${report.total} tests · ${duration} ms · ${new Date().toLocaleTimeString()}`;

  const summaryEl = document.getElementById('summary');
  summaryEl.innerHTML = `
    <div class="stat total"><div class="val">${report.total}</div><div class="lbl">Total</div></div>
    <div class="stat pass"><div class="val">${report.passed}</div><div class="lbl">Passed</div></div>
    <div class="stat fail"><div class="val">${report.failed}</div><div class="lbl">Failed</div></div>
  `;

  // ── Group by suite ────────────────────────────────────────────
  const suites = {};
  for (const r of report.results) {
    if (!suites[r.suite]) suites[r.suite] = [];
    suites[r.suite].push(r);
  }

  const container = document.getElementById('results-container');
  for (const [suiteName, tests] of Object.entries(suites)) {
    const passed = tests.filter(t => t.status === 'pass').length;
    const div = document.createElement('div');
    div.className = 'suite';
    div.innerHTML = `
      <div class="suite-header">${suiteName} — ${passed}/${tests.length}</div>
      ${tests.map(t => `
        <div class="test-row">
          <span class="badge ${t.status}">${t.status.toUpperCase()}</span>
          <div>
            <div class="test-name">${t.name}</div>
            ${t.message ? `<div class="test-msg">↳ ${t.message}</div>` : ''}
          </div>
        </div>
      `).join('')}
    `;
    container.appendChild(div);
  }
})();
</script>

</body>
</html>
