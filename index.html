<!DOCTYPE html>
<!--
  Module:   index.html
  Project:  A Penny For Our Thoughts
  Modified: May 2026 — Vue 3 migration (Sprint 0)
  Summary:  Vue 3 entry HTML. Legacy markup preserved in
            index.legacy.html during migration sprints.
            Bootstrap → src/main.ts → src/App.vue
-->
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>A Penny For Our Thoughts 💸</title>
  <meta name="description" content="Personal financial dashboard based on the 50/30/20 budget rule" />
  <link rel="icon" type="image/png" sizes="48x48" href="/A-Penny-For-Our-Thoughts/icons/favicon-48.png" />

  <!-- ── PWA: installable (MOBILE-5) ────────────────────────────────────────
       Every path below carries the /A-Penny-For-Our-Thoughts/ base because the
       app is served from a GitHub Pages subdirectory — root-relative paths 404
       in production and the install prompt silently never appears.
       This is installability only; the app is NOT offline-capable. See
       public/sw.js. -->
  <link rel="manifest" href="/A-Penny-For-Our-Thoughts/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/A-Penny-For-Our-Thoughts/icons/apple-touch-icon-180.png" />

  <!-- Theme-colour paints the Android status bar / iOS standalone chrome.
       Two entries so an installed app matches whichever theme the user is in;
       values are --bg from tokens.css for each theme. -->
  <meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0d0d12" media="(prefers-color-scheme: dark)" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Penny" />

  <!-- Fonts: Inter (body) + JetBrains Mono (numbers, amounts, dates, badges) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Chart.js loaded as a CDN global. vue-chartjs wrappers in Sprint 3
       will register components against the global Chart constructor. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

<!-- Screen-reader live announcer (visually hidden) -->
<div id="sr-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<!-- Toast notification container — replaced by ToastContainer.vue in Sprint 2 -->
<div id="toast-container" aria-live="polite" aria-atomic="false"></div>

<!-- Vue 3 mount point -->
<div id="app"></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
