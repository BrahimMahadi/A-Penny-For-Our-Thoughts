<!DOCTYPE html>
<!--
  Module:   index.html
  Project:  A Penny For Our Thoughts
  Modified: May 2026 — Vue 3 migration (Sprint 0)
  Summary:  Vue 3 entry HTML. Legacy markup preserved in
            index.legacy.html during migration sprints.
            Bootstrap → src/main.ts → src/App.vue
-->
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>A Penny For Our Thoughts 💸</title>
  <meta name="description" content="Personal financial dashboard based on the 50/30/20 budget rule" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text x='50%' y='55%' font-size='52' text-anchor='middle' dominant-baseline='middle'>💸</text></svg>" />

  <!-- Fonts: Inter (body) + JetBrains Mono (numbers, amounts, dates, badges) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Chart.js loaded as a CDN global. vue-chartjs wrappers in Sprint 3
       will register components against the global Chart constructor. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

<!-- Screen-reader live announcer (visually hidden) -->
<div id="sr-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<!-- Toast notification container — replaced by ToastContainer.vue in Sprint 2 -->
<div id="toast-container" aria-live="polite" aria-atomic="false"></div>

<!-- Vue 3 mount point -->
<div id="app"></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
